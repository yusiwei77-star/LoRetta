[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "loretta"
version = "0.1.0"
description = "Inference-only implementation of the LoRetta localization-and-registration model"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Siwei Yu"},
    {name = "Han Guo"},
    {name = "Zhenwei Shi"},
    {name = "Zhengxia Zou"},
]
license-files = [
    "LICENSE",
    "NOTICE",
    "THIRD_PARTY_NOTICES.md",
    "third_party/licenses/*.md",
    "third_party/licenses/*.txt",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
    "numpy>=2.0,<3",
    "pillow>=11.0,<13",
    "opencv-python>=4.10,<5",
    "einops>=0.8,<1",
    "huggingface_hub>=0.30,<2",
]

[project.urls]
Homepage = "https://www.siweiyu.com/work/loretta/"
Repository = "https://github.com/yusiwei77-star/LoRetta"
Weights = "https://huggingface.co/BRoss123/LoRetta"
Issues = "https://github.com/yusiwei77-star/LoRetta/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["loretta*"]

[tool.setuptools.package-data]
"loretta.third_party.dinov3" = ["LICENSE.md", "UPSTREAM.md"]

[tool.ruff]
target-version = "py310"
exclude = ["src/loretta/third_party/dinov3"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
