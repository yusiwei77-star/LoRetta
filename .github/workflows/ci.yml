name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.python }}, ${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            profile: minimum
            constraints: "-c constraints/minimum.txt"
          - python: "3.12"
            profile: current
            constraints: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install ${{ matrix.constraints }} -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install audit tools
        run: python -m pip install build bandit detect-secrets pip-audit ruff
      - name: Static checks
        run: |
          ruff check .
          bandit -r src/loretta -ll
          detect-secrets scan --all-files --exclude-files '(^|/)(\.git|\.ruff_cache|dist|build)/' > /tmp/secrets.json
          python -c 'import json; data=json.load(open("/tmp/secrets.json")); assert not data["results"], data["results"]'
          pip-audit -r requirements.txt --progress-spinner off
      - name: Build wheel
        run: python -m build --wheel
      - name: Verify wheel licenses
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("loretta-*.whl"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required = ("LICENSE", "NOTICE", "THIRD_PARTY_NOTICES", "DINOV3_LICENSE", "ROMAV2_MIT", "TORCHVISION_BSD")
          missing = [item for item in required if not any(item in name for name in names)]
          if missing:
              raise SystemExit(f"Wheel is missing license material: {missing}")
          PY
